<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Box 粉碎模拟器</title>
<style>
:root{--ink:#1d1b33;--paper:#fffdf5;--pop:#ffd43b;--hot:#ff5d5d;--sky:#4dabf7}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#bfe6ff;color:var(--ink);user-select:none;
  font-family:"Baloo 2","Fredoka","Comic Sans MS","Microsoft YaHei UI","PingFang SC",system-ui,sans-serif}
#c{position:fixed;inset:0;width:100vw;height:100vh;display:block}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink)}
#hud{position:fixed;inset:0;pointer-events:none}
#hud.off{display:none}
#stats{position:absolute;left:14px;top:14px;padding:8px 14px 10px;font-weight:800;font-size:13px;line-height:1.55;min-width:200px}
#stats b{font-size:30px;line-height:1}
#stats .dim{opacity:.6;font-weight:700;font-size:12px}
#help{position:absolute;right:14px;top:14px;padding:10px 14px;font-size:12.5px;font-weight:700;line-height:1.7}
#help kbd{background:var(--ink);color:#fff;border-radius:6px;padding:1px 6px;font-family:inherit;font-size:11.5px}
#cross{position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;border:3px solid var(--ink);border-radius:50%;
  box-shadow:0 0 0 2px #fff inset,0 0 0 2px #fff}
#cross i{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--hot);box-shadow:0 0 0 2px var(--ink)}
#tools{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:10px}
.tool{width:78px;padding:6px 0 7px;text-align:center;font-weight:800;font-size:13px;transition:transform .12s,background .12s;position:relative}
.tool .ic{font-size:28px;line-height:1.15;display:block}
.tool .k{position:absolute;left:-7px;top:-9px;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font-size:13px;line-height:24px}
.tool.on{background:var(--pop);transform:translateY(-10px) rotate(-2deg)}
#power{position:absolute;left:50%;bottom:112px;transform:translateX(-50%);padding:3px 14px;font-weight:800;font-size:13px}
#toast{position:absolute;left:50%;top:18%;transform:translateX(-50%);font-size:30px;font-weight:900;color:#fff;
  -webkit-text-stroke:6px var(--ink);paint-order:stroke fill;opacity:0;transition:opacity .25s;white-space:nowrap}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(77,171,247,.28);backdrop-filter:blur(2px)}
#menu.off{display:none}
.panel{padding:22px 30px 20px;max-width:720px;width:calc(100vw - 32px);max-height:calc(100vh - 24px);overflow:auto;text-align:center}
h1{margin:0;font-size:40px;font-weight:900;letter-spacing:1px;color:var(--pop);-webkit-text-stroke:8px var(--ink);paint-order:stroke fill}
.sub{margin:2px 0 14px;font-weight:800;opacity:.75}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
button{font:inherit;font-weight:800;font-size:14px;color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:12px;
  padding:6px 12px;box-shadow:0 4px 0 var(--ink);cursor:pointer;transition:transform .08s}
button:hover{transform:translateY(-2px)}button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
button.on{background:var(--pop)}button.big{font-size:20px;padding:10px 26px;background:var(--hot);color:#fff}
button:disabled{opacity:.4;cursor:not-allowed}
.lab{font-weight:800;font-size:13px;opacity:.7;margin-top:12px}
table{border-collapse:collapse;margin:8px auto 0;font-size:13px;font-weight:700}
td,th{border:2px solid var(--ink);padding:3px 10px}th{background:var(--pop)}
td.g{background:#b2f2bb}td.y{background:#ffec99}td.r{background:#ffc9c9}
.keys{font-size:12.5px;font-weight:700;line-height:1.8;opacity:.85;margin-top:10px}
#gpu{font-size:11.5px;opacity:.6;margin-top:8px;font-weight:700}
#fatal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#ffe3e3;font-weight:800;font-size:18px;padding:30px;text-align:center}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three/three.module.min.js"}}</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="flash"></div>
<div id="hud">
  <div id="cross"><i></i></div>
  <div id="stats" class="card"></div>
  <div id="help" class="card">
    <kbd>WASD</kbd> 移动 <kbd>Shift</kbd> 加速<br>
    <kbd>空格</kbd> 跳 / 上升 <kbd>C</kbd> 下降 <kbd>F</kbd> 飞行<br>
    <kbd>左键</kbd> 开火 <kbd>1-6</kbd>/<kbd>滚轮</kbd> 换武器<br>
    <kbd>Q</kbd><kbd>E</kbd> 威力 <kbd>T</kbd> 慢动作<br>
    <kbd>R</kbd> 一键重建 <kbd>N</kbd> 换座城<br>
    <kbd>H</kbd> 隐藏界面 <kbd>M</kbd> 静音 <kbd>Esc</kbd> 菜单
  </div>
  <div id="power" class="card"></div>
  <div id="tools"></div>
  <div id="toast"></div>
</div>
<div id="menu">
  <div class="card panel">
    <h1>📦 BOX 粉碎模拟器</h1>
    <p class="sub">GPU 物理 · 卡通渲染 · 炸它个稀巴烂</p>
    <div class="row"><button id="play" class="big">▶ 开始粉碎</button></div>
    <div class="lab">Box 数量</div>
    <div class="row" id="tiers"></div>
    <div class="row"><button id="bench">🏁 跑分：这台机器能带动多少 Box？</button></div>
    <div id="benchOut"></div>
    <div class="keys">WASD 移动 · Shift 加速 · 空格 跳（双击切换飞行）· 左键开火 · 1-6 换武器 · Q/E 威力<br>R 重建 · N 换城 · T 慢动作 · H 隐藏界面 · M 静音 · Esc 回到菜单</div>
    <div id="gpu"></div>
  </div>
</div>
<div id="fatal"></div>

<script type="module">
import * as THREE from 'three';

// ───────────────────────── 常量 / 工具 ─────────────────────────
const $ = (id) => document.getElementById(id);
const MAXF = 16, GY = 64, TX = 8, EYE = 1.7;
const TIERS = [
  { S: 128, G: 96 }, { S: 256, G: 160 }, { S: 512, G: 288 }, { S: 724, G: 384 },
  { S: 1024, G: 512 }, { S: 1448, G: 704 }, { S: 2048, G: 960 },
  // 网格图集超过 ~300MB 后 GPU 随机访问会断崖式变慢，所以 839 万档把城市建得更密（网格 306MB）；
  // 1678 万档无论如何都超了，只当极限展示：静止/局部破坏可玩，全城齐爆会很卡
  { S: 2896, G: 1120 }, { S: 4096, G: 1920 },
];
const fmtCN = (n) => n >= 1e6 ? (n / 1e4).toFixed(0) + ' 万' : (n / 1e4).toFixed(1) + ' 万';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const V3 = THREE.Vector3;
function fatal(msg) { const f = $('fatal'); f.style.display = 'flex'; f.textContent = msg; throw new Error(msg); }
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ───────────────────────── 渲染器 ─────────────────────────
const canvas = $('c');
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance', stencil: false }); }
catch (e) { fatal('无法创建 WebGL2 上下文：' + e.message); }
const gl = renderer.getContext();
if (!gl.getExtension('EXT_color_buffer_float')) fatal('此显卡/浏览器不支持浮点渲染目标 (EXT_color_buffer_float)，无法运行 GPU 物理。');
const FLOAT_BLEND = !!gl.getExtension('EXT_float_blend');   // 网格登记用 MAX 混合让静止 Box 优先，需要它
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight, false);
renderer.setClearColor(0x000000, 0);
const MAX_TEX = gl.getParameter(gl.MAX_TEXTURE_SIZE);
const dbgExt = gl.getExtension('WEBGL_debug_renderer_info');
const GPU = dbgExt ? gl.getParameter(dbgExt.UNMASKED_RENDERER_WEBGL) : '未知 GPU';
let lost = false;
canvas.addEventListener('webglcontextlost', (e) => { e.preventDefault(); lost = true; const f = $('fatal'); f.style.display = 'flex'; f.textContent = 'WebGL 上下文丢失（多半是显存不够）。刷新页面并选择较低的 Box 档位。'; });

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 6000);
camera.rotation.order = 'YXZ';
const sunDir = new V3(0.45, 0.75, 0.35).normalize();
const FOG = new V3(0.84, 0.94, 1.0);

// ───────────────────────── GLSL ─────────────────────────
const COMMON = `
precision highp float; precision highp int; precision highp sampler2D;
uint pcg(uint v){ uint s = v * 747796405u + 2891336453u; uint w = ((s >> ((s >> 28u) + 4u)) ^ s) * 277803737u; return (w >> 22u) ^ w; }
float h1(uint v){ return float(pcg(v)) * (1.0 / 4294967295.0); }
vec3 h3(uint v){ return vec3(h1(v), h1(v + 0x9e3779b9u), h1(v + 0x7f4a7c15u)); }
vec3 hdir(uint v){ vec3 h = h3(v); float z = h.x * 2.0 - 1.0; float a = h.y * 6.2831853; float r = sqrt(max(0.0, 1.0 - z * z)); return vec3(r * cos(a), z, r * sin(a)); }
vec3 qrot(vec4 q, vec3 v){ return v + 2.0 * cross(q.xyz, cross(q.xyz, v) + q.w * v); }
vec4 qmul(vec4 a, vec4 b){ return vec4(a.w * b.xyz + b.w * a.xyz + cross(a.xyz, b.xyz), a.w * b.w - dot(a.xyz, b.xyz)); }
`;
const FS_VERT = COMMON + `in vec3 position; void main(){ gl_Position = vec4(position.xy, 0.0, 1.0); }`;

// 状态编码：pos.w = state + heat   (0 结构静止 / 1 活跃 / 2 废墟静止 / 3 被黑洞吞噬 / 4 归位中 / 5 未使用)
//          vel.w = 结构:支撑距离  活跃:静止计数
const INIT_FRAG = COMMON + `
uniform sampler2D tHome;
layout(location = 0) out vec4 oPos; layout(location = 1) out vec4 oVel; layout(location = 2) out vec4 oRot;
void main(){ oPos = texelFetch(tHome, ivec2(gl_FragCoord.xy), 0); oVel = vec4(0.0); oRot = vec4(0.0, 0.0, 0.0, 1.0); }`;

// 把每个 Box 写进 3D 网格图集，每格只能登记一个 Box。
// 常规编码：活跃 = id+1，静止 = id+1+2^23，配合 MAX 混合 → 同一格里静止的永远压过活跃的（撞进墙里的碎块一定能“看见”墙）。
// 超过 2^23 个 Box（或不支持浮点混合）时退回：活跃 = +(id+1)，静止 = -(id+1)，后画的覆盖先画的。
const GRID_VERT = COMMON + `
uniform sampler2D tPos; uniform int uS, uTX, uBig; uniform ivec3 uGD; uniform vec3 uGO; uniform vec2 uAtlas;
flat out int vId;   // 整数 + flat：id 超过 2^22 后浮点插值会差 1
void main(){
  int id = gl_VertexID; gl_PointSize = 1.0;
  vec4 P = texelFetch(tPos, ivec2(id % uS, id / uS), 0);
  float st = floor(P.w);
  ivec3 c = ivec3(floor(P.xyz - uGO));
  bool ok = st < 2.5 && c.x >= 0 && c.y >= 0 && c.z >= 0 && c.x < uGD.x && c.y < uGD.y && c.z < uGD.z;
  c = clamp(c, ivec3(0), uGD - 1);
  // 布局：每个 (x,z) 柱子的 64 层占一个 8×8 纹素小块 → 3×3×3 邻域在纹理里也是紧挨着的（缓存友好）
  vec2 a = vec2(float(c.x * uTX + (c.y % uTX)), float(c.z * uTX + c.y / uTX));
  gl_Position = ok ? vec4((a + 0.5) / uAtlas * 2.0 - 1.0, 0.0, 1.0) : vec4(2.0, 2.0, 2.0, 1.0);
  bool stc = st != 1.0;
  vId = uBig == 1 ? (stc ? -(id + 1) : id + 1) : (id + 1 + (stc ? 8388608 : 0));
}`;
const GRID_FRAG = `precision highp float; precision highp int; flat in int vId; out vec4 o; void main(){ o = vec4(float(vId), 0.0, 0.0, 1.0); }`;

const SIM_FRAG = COMMON + `
#define GRAV 30.0
#define VMAX 90.0
#define CAP 6.0
#define HIT 11.0
#define EH 0.565                                         // 碎块的水平半宽：落地后带 ±8° 偏航，取其包围盒
#define IS_ST(g) ((g) < 0.0 || (g) > uSOFF)              // 网格值 → 静止的 Box
#define IS_AW(g) ((g) > 0.0 && (g) <= uSOFF)             // 网格值 → 活跃的 Box
uniform sampler2D tPos, tVel, tRot, tHome, tGrid;
uniform int uS, uTX, uFrame, uNF; uniform ivec3 uGD; uniform vec3 uGO;
uniform float uDt, uRebuildT, uSOFF;
uniform vec4 uFA[MAXF]; uniform vec4 uFB[MAXF];
layout(location = 0) out vec4 oPos; layout(location = 1) out vec4 oVel; layout(location = 2) out vec4 oRot;

float gridAt(ivec3 c){
  if (c.x < 0 || c.y < 0 || c.z < 0 || c.x >= uGD.x || c.y >= uGD.y || c.z >= uGD.z) return 0.0;
  return texelFetch(tGrid, ivec2(c.x * uTX + (c.y % uTX), c.z * uTX + c.y / uTX), 0).r;
}
ivec2 tcOf(float g){ float m = abs(g); if (m > uSOFF) m -= uSOFF; int n = int(m + 0.5) - 1; return ivec2(n % uS, n / uS); }

void main(){
  ivec2 tc = ivec2(gl_FragCoord.xy);
  int id = tc.y * uS + tc.x; uint uid = uint(id);
  vec4 P = texelFetch(tPos, tc, 0), V = texelFetch(tVel, tc, 0), Q = texelFetch(tRot, tc, 0);
  vec3 p = P.xyz, v = V.xyz;
  float st = floor(P.w), heat = max(P.w - st - uDt * 0.5, 0.0), aux = V.w;
  if (st > 4.5) { oPos = P; oVel = V; oRot = Q; return; }

  // ── 一键重建：从下往上依次飞回原位
  if (uRebuildT >= 0.0 || st == 4.0) {
    vec4 H = texelFetch(tHome, tc, 0);
    if (st != 0.0 && st != 4.0 && uRebuildT > H.y * 0.03 + h1(uid) * 0.3) st = 4.0;
    if (st == 4.0) {
      vec3 d = H.xyz - p; float dist = length(d);
      float stepLen = max(dist * (1.0 - exp(-uDt * 5.0)), 16.0 * uDt);
      if (dist <= stepLen) { p = H.xyz; st = 0.0; Q = vec4(0.0, 0.0, 0.0, 1.0); }
      else { p += d / dist * stepLen; Q = normalize(mix(Q, vec4(0.0, 0.0, 0.0, Q.w < 0.0 ? -1.0 : 1.0), 1.0 - exp(-uDt * 6.0))); }
      oPos = vec4(p, st + min(heat, 0.98)); oVel = vec4(0.0); oRot = Q; return;
    }
  }

  // ── 被黑洞吞掉的：黑洞消失时喷出来
  if (st == 3.0) {
    bool held = false;
    for (int i = 0; i < uNF; i++) {
      if (int(uFB[i].x + 0.5) == 2 && distance(p, uFA[i].xyz) < uFB[i].w * 2.5) {
        held = true; p = mix(p, uFA[i].xyz + (h3(uid) - 0.5) * uFB[i].w * 0.6, 0.2);
      }
    }
    if (held) v = vec3(0.0);
    else {
      st = 1.0; vec3 dir = hdir(uid + uint(uFrame)); dir.y = abs(dir.y) * 0.7 + 0.25;
      v = dir * (16.0 + 34.0 * h1(uid * 3u + 1u)); heat = 0.95; aux = 0.0;
    }
    oPos = vec4(p, st + min(heat, 0.98)); oVel = vec4(v, aux); oRot = Q; return;
  }

  // ── 力场：1 爆炸冲量 / 2 黑洞 / 4 龙卷风 / 5 玩家推挤
  vec3 acc = vec3(0.0, -GRAV, 0.0), dv = vec3(0.0);
  bool wake = false, capture = false, inField = false; float drag = 0.0;
  for (int i = 0; i < uNF; i++) {
    vec4 A = uFA[i], B = uFB[i]; int ty = int(B.x + 0.5);
    vec3 d = p - A.xyz; float R = A.w;
    if (ty == 1) {
      float d2 = dot(d, d);
      if (d2 < R * R) {
        float fall = 1.0 - sqrt(d2) / R;
        vec3 dir = normalize(d + vec3(0.0, 0.3 * R, 0.0) + (h3(uid + uint(i)) - 0.5) * 0.25 * R);
        dv += dir * B.y * (0.2 + 0.8 * fall);
        heat = max(heat, min(fall * B.z, 0.98)); wake = true;
      }
    } else if (ty == 2) {
      float dist = length(d);
      if (dist < R) {
        float f = 1.0 - dist / R; inField = true;
        if (dist < R * min(1.0, 0.3 + B.z * 0.45)) wake = true;
        vec3 inw = -d / max(dist, 1e-3);
        vec3 tg = cross(vec3(0.0, 1.0, 0.0), d); tg /= max(length(tg), 1e-3);
        acc += inw * B.y * (0.35 + 1.6 * f * f) + tg * B.y * 0.6 * f + vec3(0.0, GRAV * smoothstep(0.0, 0.45, f), 0.0);
        drag += 0.7 * f;
        if (dist < B.w) capture = true;
      }
    } else if (ty == 4) {
      vec2 h = d.xz; float hd = length(h);
      if (hd < R && d.y < B.w) {
        float f = 1.0 - hd / R; inField = true;
        if (hd < R * 0.6) wake = true;
        vec2 hn = h / max(hd, 1e-3);
        vec3 tv = vec3(-hn.y, 0.0, hn.x) * B.y * (0.45 + 0.9 * f) + vec3(0.0, B.y * 0.5 * (0.3 + f), 0.0) - vec3(hn.x, 0.0, hn.y) * B.y * 0.7 * (0.5 - f);
        acc += (tv - v) * 3.0 * (0.25 + f) + vec3(0.0, GRAV * 0.85, 0.0);
      }
    } else if (ty == 5) {
      float dist = length(d);
      if (dist < R) {
        vec3 n = d / max(dist, 1e-3); vec3 pv = B.yzw;
        if (st == 1.0) acc += n * 260.0 * (1.0 - dist / R) + pv * 4.0;
        else if (dot(pv, pv) > 9.0) { wake = true; dv += pv * 0.8 + n * 3.0 + vec3(0.0, 2.5, 0.0); }
      }
    }
  }

  // ── 静止的 Box：只检查「还撑得住吗 / 被砸到了吗」
  if (st != 1.0) {
    bool crumble = false;
    if (!wake && uRebuildT < 0.0) {
      ivec3 c = ivec3(floor(p - uGO));
      bool inG = c.x >= 0 && c.y >= 0 && c.z >= 0 && c.x < uGD.x && c.y < uGD.y && c.z < uGD.z;
      if (st == 0.0) {
        if (inG && ((id + uFrame) & 1) == 0) {
          float sd = c.y == 0 ? 0.0 : 99.0;       // 支撑距离：正下方 +0，侧面 +1，超过 CAP 就塌
          for (int k = 0; k < 6; k++) {
            ivec3 o = k == 0 ? ivec3(0, -1, 0) : k == 1 ? ivec3(1, 0, 0) : k == 2 ? ivec3(-1, 0, 0) : k == 3 ? ivec3(0, 0, 1) : k == 4 ? ivec3(0, 0, -1) : ivec3(0, 1, 0);
            float g = gridAt(c + o);
            if (IS_ST(g)) { if (k < 5) { float nd = texelFetch(tVel, tcOf(g), 0).w; sd = min(sd, k == 0 ? nd : nd + 1.0); } }
            else if (g != 0.0) {   // 被活跃 Box 正面撞上才会醒，只继承一部分法向速度（能量递减，不会连锁失控）
              float vn = -dot(texelFetch(tVel, tcOf(g), 0).xyz, vec3(o));
              if (vn > HIT) { wake = true; dv -= vec3(o) * vn * 0.4; }
            }
          }
          aux = sd;
          if (sd > CAP) { wake = true; crumble = true; }
        }
      } else if (((id + uFrame) & 3) == 0) {
        bool sup = p.y < 0.62 || !inG;
        for (int dy = -1; dy <= 1; dy++) for (int dz = -1; dz <= 1; dz++) for (int dx = -1; dx <= 1; dx++) {
          float g = gridAt(c + ivec3(dx, dy, dz)); if (g == 0.0) continue;
          ivec2 nt = tcOf(g); if (nt == tc) continue;
          if (dx == 0 && dy == 0 && dz == 0) { wake = true; continue; }   // 自己的格子被别人登记了 → 别人看不见我，醒来挪开
          if (IS_AW(g)) {
            vec3 nv = texelFetch(tVel, nt, 0).xyz;
            if (dot(nv, nv) > HIT * HIT) {
              vec3 dd = p - texelFetch(tPos, nt, 0).xyz; float d2 = dot(dd, dd);
              if (d2 < 1.6 && d2 > 1e-6) { dd /= sqrt(d2); float vn = dot(nv, dd); if (vn > HIT) { wake = true; dv += dd * vn * 0.4; } }
            }
          }
          if (!sup && dy <= 0) {   // 正下方有底面和我重叠的 Box 托着
            vec3 dd = p - texelFetch(tPos, nt, 0).xyz;
            if (dd.y > 0.5 && dd.y < 1.15 && abs(dd.x) < 1.05 && abs(dd.z) < 1.05) sup = true;
          }
        }
        if (!sup) wake = true;
      }
    }
    if (wake) {
      st = 1.0; v = dv; aux = 0.0;
      // 结构失去支撑而垮塌时带一点随机横向速度，整列 Box 才会散架而不是原地叠回去
      if (crumble) { vec3 j = h3(uid + uint(uFrame) * 7919u) - 0.5; v += vec3(j.x, 0.0, j.z) * 3.0; }
    }
    oPos = vec4(p, st + min(heat, 0.98)); oVel = vec4(v, aux); oRot = Q; return;
  }

  // ── 活跃的 Box：按「真方块」碰撞 + 积分
  // 形状 = 平放的方块（高 1，水平半宽 EH），两两按包围盒求交，沿穿透最浅的那根轴分离：
  //   · 竖直方向永远是面贴面，上层正好高出 1，不会像球那样陷进下层的缝里
  //   · 邻居一定落在 3×3×3 格内，不会漏检
  // 响应用「速度投影 + 位置修正」而不是弹簧：重叠再深也不会凭空产生能量（不会爆米花）
  if (capture) { oPos = vec4(p, 3.0 + min(heat, 0.98)); oVel = vec4(0.0); oRot = Q; return; }
  v += dv + acc * uDt;
  vec3 corr = vec3(0.0), bestO = vec3(0.0, 1.0, 0.0); vec2 tsum = vec2(0.0);
  float nsup = 0.0, maxPen = 0.0, bestS = -1.0; bool supSt = false, centered = false, hidden = false;
  float climbAt = aux < -20.0 ? 0.08 : 0.3;               // 卡着重叠太久（aux 用负数记帧数）就放宽「往上爬」的门槛
  ivec3 c = ivec3(floor(p - uGO));
  if (c.x >= -1 && c.y >= -1 && c.z >= -1 && c.x <= uGD.x && c.y <= uGD.y && c.z <= uGD.z) {
    for (int dy = -1; dy <= 1; dy++) for (int dz = -1; dz <= 1; dz++) for (int dx = -1; dx <= 1; dx++) {
      float g = gridAt(c + ivec3(dx, dy, dz));
      if (g == 0.0) {   // 空格子：先记一个最合适的（正上方 > 同层 > 斜上 > 下层，带点随机），万一我是“隐形”的就搬过去
        if (c.y + dy >= 0) {
          float s = (dy == 1 ? (dx == 0 && dz == 0 ? 9.0 : 4.0) : (dy == 0 ? 6.0 : 1.0)) + h1(uid * 31u + uint(dx + 1 + (dy + 1) * 3 + (dz + 1) * 9)) * 3.0;
          if (s > bestS) { bestS = s; bestO = vec3(float(dx), float(dy), float(dz)); }
        }
        continue;
      }
      ivec2 nt = tcOf(g); if (nt == tc) continue;
      if (dx == 0 && dy == 0 && dz == 0) { hidden = true; continue; }   // 我这格登记的是别人 → 谁也看不见我
      vec4 NP = texelFetch(tPos, nt, 0);
      vec3 d = p - NP.xyz;
      float eh = EH + (NP.w < 1.0 ? 0.5 : EH);            // 结构里的 Box 是严格对齐的，半宽正好 0.5
      vec3 pen = vec3(eh, 1.03, eh) - abs(d);             // 竖直方向留 0.03 的“接触皮”：贴着就算托住，不会一帧碰一帧不碰
      if (pen.x <= 0.0 || pen.y <= 0.0 || pen.z <= 0.0) continue;
      bool dyn = IS_AW(g);
      bool noDown = d.y < 0.0 && p.y - 0.5 < pen.y;       // 往下推会被按进地里 → 改走水平方向
      vec3 n; float depth, share = dyn ? 0.3 : 0.6, vsh = dyn ? 0.575 : 1.15;
      if (pen.y <= pen.x && pen.y <= pen.z && !noDown) {
        n = vec3(0.0, d.y < 0.0 ? -1.0 : 1.0, 0.0); depth = max(pen.y - 0.03, 0.0);
        // 上下叠着的两个活跃 Box：上面的让着下面的（下面那个多半被别的托着，推不动），整摞才不会一直往下陷。
        // 速度上只在「轻轻压着」时这么做（vsh < 0 作标记，下面再定）；真撞上了还是一人一半，否则会凭空造出动量把人堆顶上天
        if (dyn) { share = d.y > 0.0 ? 0.6 : 0.0; vsh = -1.0; }
      }
      else if (min(pen.x, pen.z) > climbAt && (dyn || aux < -20.0)) {
        // 横向挤得太深（人堆里两边都顶着，横着推只会互相抵消）→ 让其中一个爬到另一个头顶上去，废墟就往上堆。
        // 位置高的爬，一样高就编号大的爬，另一个原地不动；对方是静止的（夹在两个静止 Box 中间出不来）就只能我爬。
        int nid = nt.y * uS + nt.x;
        if (!(d.y > 0.02 || (d.y >= -0.02 && (id > nid || !dyn)))) { maxPen = max(maxPen, 0.3); continue; }
        n = vec3(0.0, 1.0, 0.0); depth = 1.0 - d.y; share = 0.6; vsh = 1.15;
      }
      else if (pen.x <= pen.z) { n = vec3(d.x < 0.0 ? -1.0 : 1.0, 0.0, 0.0); depth = pen.x; }
      else { n = vec3(0.0, 0.0, d.z < 0.0 ? -1.0 : 1.0); depth = pen.z; }
      vec3 rv = dyn ? v - texelFetch(tVel, nt, 0).xyz : v;
      float vn = dot(rv, n);
      if (vsh < 0.0) vsh = vn > -2.0 ? (d.y > 0.0 ? 1.0 : 0.0) : 0.55;
      if (vn < 0.0) {
        v -= n * vn * (vn > -1.5 ? min(vsh, 1.0) : vsh);                  // 去掉相互靠近的法向速度（撞得重才留一点弹性）
        if (n.y > 0.5 && vn < -3.0) v.xz += d.xz * min(-vn, 20.0) * 0.3;  // 砸在别人头上又没砸正：向外弹开，废墟才会摊开
      }
      v -= (rv - vn * n) * min(1.0, (dyn ? 2.0 : 6.0) * uDt);             // 切向摩擦
      corr += n * depth * share;
      maxPen = max(maxPen, depth);
      if (n.y > 0.5) {
        nsup += 1.0; tsum += d.xz; if (!dyn) supSt = true;
        if (max(abs(d.x), abs(d.z)) < 0.42) centered = true;
      }
    }
  }
  if (hidden) {   // 网格每格只能登记一个：我这格被别人占了 → 直接搬去旁边的空格，实在没有就往上钻
    maxPen = 1.0;
    if (dot(v, v) < 36.0) {
      vec3 tgt = bestS > 0.0 ? vec3(c) + bestO + 0.5 + uGO - p : vec3(0.0, 1.0, 0.0);
      corr = tgt / max(length(tgt), 1e-3) * 0.3;
      v *= 0.5;   // 搬家期间别让重力把速度越攒越大
    } else corr = vec3(0.0);   // 正被炸飞/喷出来的不用管，自己就飞散了
  } else { float cl = length(corr); if (cl > 0.3) corr *= 0.3 / cl; }
  // 重心悬在所有支撑面之外 → 站不住，从边上滑下去
  bool over = false;
  if (nsup > 0.0 && !centered) {
    vec2 tm = tsum / nsup;
    if (max(abs(tm.x), abs(tm.y)) > 0.42) { over = true; v.xz += tm / max(length(tm), 1e-3) * 9.0 * uDt; }
  }
  v *= 1.0 - min(drag * uDt, 0.5);
  float sp = length(v); if (sp > VMAX) { v *= VMAX / sp; sp = VMAX; }
  p += v * uDt + corr;
  bool grounded = false;
  if (p.y < 0.5) {
    p.y = 0.5; grounded = true; over = false;
    v.y = v.y < -4.0 ? -v.y * 0.32 : max(v.y, 0.0);
    v.xz *= exp(-uDt * 4.0);
  }

  // 姿态：空中随便翻滚；一旦有东西托着，就转成「某个面朝上 + 朝向对齐世界轴（每个 Box 带 ±8° 的固定偏差）」
  vec3 w = cross(vec3(0.0, 1.0, 0.0), v) * 0.9 + (h3(uid) - 0.5) * sp * 0.5;
  float aerr = 0.0;
  if (grounded || nsup > 0.0) {
    vec4 Qc = vec4(-Q.xyz, Q.w);
    vec3 upL = qrot(Qc, vec3(0.0, 1.0, 0.0)), a = abs(upL);
    vec3 ax = (a.x > a.y && a.x > a.z) ? vec3(sign(upL.x), 0.0, 0.0) : (a.y > a.z ? vec3(0.0, sign(upL.y), 0.0) : vec3(0.0, 0.0, sign(upL.z)));
    vec3 e1 = cross(qrot(Q, ax), vec3(0.0, 1.0, 0.0));
    float phi = (h1(uid * 5u + 3u) - 0.5) * 0.28;
    vec3 tX = vec3(cos(phi), 0.0, sin(phi));
    vec3 xL = qrot(Qc, tX), b = abs(xL) * (1.0 - abs(ax));
    vec3 bx = (b.x > b.y && b.x > b.z) ? vec3(sign(xL.x), 0.0, 0.0) : (b.y > b.z ? vec3(0.0, sign(xL.y), 0.0) : vec3(0.0, 0.0, sign(xL.z)));
    float e2 = cross(qrot(Q, bx), tX).y;
    aerr = length(e1) + abs(e2);
    w = w * 0.35 + (e1 + vec3(0.0, e2, 0.0)) * 14.0;
  }
  Q = normalize(Q + 0.5 * uDt * qmul(vec4(w, 0.0), Q));

  // 入睡条件：被地面/已静止的 Box 稳稳托住（废墟自下而上逐层冻结），并且此刻没和任何人重叠、姿态已摆正、没被“隐形”。
  // 互相架住、谁也等不到对方先静止的情况：多熬一会儿也让它睡。
  bool stable = grounded || (supSt && !over);
  bool slow = !inField && dot(v, v) < 0.25;
  bool calm = slow && !hidden && maxPen < 0.08 && aerr < 0.15;
  if (calm && (stable || nsup > 0.0)) aux = max(aux, 0.0) + uDt * 60.0;
  else if (slow && maxPen >= 0.08) aux = max(min(aux, 0.0) - uDt * 60.0, -90.0);   // 不动了却还叠着：负数累计「卡住」的帧数
  else aux = 0.0;
  // 卡了一秒还只是轻微挤着（比如正好掉进一格宽的缝里）：别再折腾了，就地睡
  bool giveUp = aux <= -60.0 && maxPen < 0.14 && !hidden && (stable || nsup > 0.0);
  if (aux > (stable ? 14.0 : 45.0) || giveUp) { st = 2.0; v = vec3(0.0); aux = 0.0; }
  oPos = vec4(p, st + min(heat, 0.98)); oVel = vec4(v, aux); oRot = Q;
}`;

// 准星拾取：在网格图集里做 3D DDA 光线步进（1×1 像素）
const PICK_FRAG = COMMON + `
uniform sampler2D tGrid; uniform int uTX; uniform ivec3 uGD; uniform vec3 uGO, uRo, uRd;
out vec4 o;
float gridAt(ivec3 c){ return texelFetch(tGrid, ivec2(c.x * uTX + (c.y % uTX), c.z * uTX + c.y / uTX), 0).r; }
void main(){
  vec3 rd = uRd + vec3(equal(uRd, vec3(0.0))) * 1e-6;
  vec3 inv = 1.0 / rd, dim = vec3(uGD), ro = uRo - uGO;
  vec3 ta = -ro * inv, tb = (dim - ro) * inv;
  vec3 t0 = min(ta, tb), t1 = max(ta, tb);
  float tn = max(max(t0.x, t0.y), max(t0.z, 0.0)), tf = min(min(t1.x, t1.y), t1.z);
  float tG = rd.y < -1e-5 ? -uRo.y / rd.y : 1e9;
  float tHit = 1e9;
  if (tn < tf) {
    vec3 pp = ro + rd * (tn + 1e-3);
    ivec3 c = ivec3(clamp(floor(pp), vec3(0.0), dim - 1.0));
    ivec3 sg = ivec3(sign(rd));
    vec3 td = abs(inv);
    vec3 tm = (vec3(c) + max(sign(rd), 0.0) - ro) * inv;
    float t = tn;
    for (int i = 0; i < 2400; i++) {
      if ((i > 0 || tn > 0.0) && gridAt(c) != 0.0) { tHit = t; break; }
      if (tm.x < tm.y && tm.x < tm.z) { t = tm.x; tm.x += td.x; c.x += sg.x; }
      else if (tm.y < tm.z) { t = tm.y; tm.y += td.y; c.y += sg.y; }
      else { t = tm.z; tm.z += td.z; c.z += sg.z; }
      if (c.x < 0 || c.y < 0 || c.z < 0 || c.x >= uGD.x || c.y >= uGD.y || c.z >= uGD.z || t > tG) break;
    }
  }
  float t = min(tHit, tG);
  float kind = tHit < tG ? 2.0 : (tG < 1e8 ? 1.0 : 0.0);
  if (kind == 0.0) t = 90.0;
  t = min(t, 1500.0);
  o = vec4(uRo + uRd * t, kind);
}`;

// 俯视阴影贴图（每个 Box 一个点，沿太阳方向投到地面）
const SHADOW_VERT = COMMON + `
uniform sampler2D tPos; uniform int uS; uniform vec2 uSunXZ; uniform float uHalf, uPx;
void main(){
  int id = gl_VertexID; vec4 P = texelFetch(tPos, ivec2(id % uS, id / uS), 0); float st = floor(P.w);
  vec2 g = P.xz - uSunXZ * (P.y - 0.2);
  gl_Position = (st == 3.0 || st > 4.5) ? vec4(2.0, 2.0, 2.0, 1.0) : vec4(g / uHalf, 0.0, 1.0);
  gl_PointSize = uPx;
}`;
const SHADOW_FRAG = `precision highp float; out vec4 o; void main(){ o = vec4(1.0); }`;

// Box 渲染：每个实例只画朝向相机的 3 个面（7 顶点 / 6 三角形），卡通分色 + 描边
const BOX_VERT = COMMON + `
in vec3 position;
uniform mat4 projectionMatrix, viewMatrix; uniform vec3 cameraPosition;
uniform sampler2D tPos, tRot, tCol; uniform int uS; uniform vec3 uSun; uniform float uFogNear, uFogFar;
out vec3 vL; out vec3 vBand; out vec3 vCol; out float vHeat; out float vFog;
float toon(float d){ return d > 0.6 ? 1.0 : (d > 0.42 ? 0.86 : (d > 0.0 ? 0.74 : 0.6)); }
void main(){
  int id = gl_InstanceID; ivec2 tc = ivec2(id % uS, id / uS);
  vec4 P = texelFetch(tPos, tc, 0);
  float st = floor(P.w);
  vL = vec3(0.0); vBand = vec3(0.0); vCol = vec3(0.0); vHeat = 0.0; vFog = 0.0;
  if (st == 3.0 || st > 4.5) { gl_Position = vec4(2.0, 2.0, 2.0, 1.0); return; }
  vec4 Q = texelFetch(tRot, tc, 0);
  vec3 toCam = cameraPosition - P.xyz;
  vec3 s = mix(vec3(-1.0), vec3(1.0), step(0.0, qrot(vec4(-Q.xyz, Q.w), toCam)));
  vec3 lp = position * s;
  vL = lp;
  vBand = vec3(toon(dot(qrot(Q, vec3(s.x, 0.0, 0.0)), uSun)), toon(dot(qrot(Q, vec3(0.0, s.y, 0.0)), uSun)), toon(dot(qrot(Q, vec3(0.0, 0.0, s.z)), uSun)));

  gl_Position = projectionMatrix * viewMatrix * vec4(P.xyz + qrot(Q, lp), 1.0);
}`;
const BOX_FRAG = `precision highp float;
in vec3 vL; in vec3 vBand; in vec3 vCol; in float vHeat; in float vFog;
uniform vec3 uFog; uniform float uFlash;
out vec4 fragColor;
void main(){
  vec3 a = abs(vL); float band, e;
  if (a.x >= a.y && a.x >= a.z) { band = vBand.x; e = max(a.y, a.z); }
  else if (a.y >= a.z) { band = vBand.y; e = max(a.x, a.z); }
  else { band = vBand.z; e = max(a.x, a.y); }
  vec3 col = vCol * band;
  col = mix(col, mix(vec3(1.0, 0.42, 0.08), vec3(1.0, 0.96, 0.7), smoothstep(0.45, 0.95, vHeat)), smoothstep(0.02, 0.5, vHeat) * 0.9);
  float fw = fwidth(e) + 1e-4;
  float line = smoothstep(0.44 - fw, 0.44 + fw * 0.5, e);
  line = mix(line, 0.22, clamp(fw * 4.0 - 0.2, 0.0, 1.0));
  col = mix(col, col * 0.3 + vec3(0.02, 0.0, 0.05), line);
  fragColor = vec4(mix(col, uFog, vFog) + uFlash, 1.0);
}`;

// ───────────────────────── 城市生成 ─────────────────────────
const PALETTE = [[255, 107, 107], [255, 212, 59], [105, 219, 124], [77, 150, 255], [255, 159, 69], [199, 125, 255], [46, 196, 182], [255, 143, 171], [250, 243, 221], [116, 220, 255]];
const HEART = ['.XX...XX.', 'XXXX.XXXX', 'XXXXXXXXX', 'XXXXXXXXX', '.XXXXXXX.', '..XXXXX..', '...XXX...', '....X....'];
const SMILE = ['..XXXXX..', '.X.....X.', 'X..X.X..X', 'X..X.X..X', 'X.......X', 'X.X...X.X', 'X..XXX..X', '.X.....X.', '..XXXXX..'];
function generateCity(N, G, seed) {
  const rnd = mulberry32(seed);
  const home = new Float32Array(N * 4), col = new Uint8Array(N * 4);
  const half = G / 2, HMAX = GY - 8;
  let n = 0;
  const emit = (x, y, z, c, k = 1) => {
    if (n >= N || y > HMAX + 3) return;
    const i = n * 4, j = (0.93 + rnd() * 0.14) * k;
    home[i] = x + 0.5 - half; home[i + 1] = y + 0.5; home[i + 2] = z + 0.5 - half;
    col[i] = Math.min(255, c[0] * j); col[i + 1] = Math.min(255, c[1] * j); col[i + 2] = Math.min(255, c[2] * j); col[i + 3] = 255;
    n++;

function updatePower() { $('power').textContent = `${TOOLS[tool].icon} ${TOOLS[tool].name}　威力 ×${power.toFixed(2)}`; }
let toastT = 0;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.style.opacity = 1; clearTimeout(toastT); toastT = setTimeout(() => { t.style.opacity = 0; }, 1300); }

function setActive(on) {
  active = on; $('menu').classList.toggle('off', on); if (!on) { firing = false; for (const k in keys) keys[k] = false; }
}
function enter() {
  sfx.init(); freeMode = false;
  let p; try { p = canvas.requestPointerLock(); } catch (e) { p = null; }
  if (p && p.catch) p.catch(() => { freeMode = true; setActive(true); });
  setTimeout(() => { if (document.pointerLockElement !== canvas && !active) { freeMode = true; setActive(true); } }, 400);
}
document.addEventListener('pointerlockchange', () => { if (document.pointerLockElement === canvas) { freeMode = false; setActive(true); } else if (!freeMode) setActive(false); });
document.addEventListener('mousemove', (e) => {
  if (!active || (freeMode && !(e.buttons & 2))) return;
  P.yaw -= e.movementX * 0.0022; P.pitch = clamp(P.pitch - e.movementY * 0.0022, -1.55, 1.55);
});
canvas.addEventListener('mousedown', (e) => { if (active && e.button === 0) firing = true; });
addEventListener('mouseup', (e) => { if (e.button === 0) firing = false; });
canvas.addEventListener('contextmenu', (e) => e.preventDefault());
addEventListener('wheel', (e) => { if (active) selectTool(tool + (e.deltaY > 0 ? 1 : -1)); }, { passive: true });
addEventListener('keydown', (e) => {
  if (!active) return;
  if (e.code === 'Escape' && freeMode) { freeMode = false; setActive(false); return; }
  if (['Space', 'Tab'].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  keys[e.code] = true;
  if (e.code.startsWith('Digit')) { const i = +e.code.slice(5) - 1; if (i >= 0 && i < TOOLS.length) selectTool(i); }
  else if (e.code === 'KeyR') startRebuild();
  else if (e.code === 'KeyN') { setTier(tierIdx); toast('🏙️ 新的城市'); }
  else if (e.code === 'KeyQ') { power = clamp(power / 1.25, 0.41, 3.05); updatePower(); }
  else if (e.code === 'KeyE') { power = clamp(power * 1.25, 0.41, 3.05); updatePower(); }
  else if (e.code === 'KeyF') { P.fly = !P.fly; toast(P.fly ? '🕊️ 飞行模式' : '🚶 步行模式'); }
  else if (e.code === 'KeyT') { timeScale = timeScale === 1 ? 0.2 : 1; toast(timeScale === 1 ? '⏩ 正常速度' : '🐌 慢动作'); }
  else if (e.code === 'KeyH') { hudOn = !hudOn; $('hud').classList.toggle('off', !hudOn); }
  else if (e.code === 'KeyM') toast(sfx.toggle() ? '🔇 静音' : '🔊 有声');
  else if (e.code === 'Space') { const n = performance.now(); if (n - lastSpace < 280) { P.fly = !P.fly; toast(P.fly ? '🕊️ 飞行模式' : '🚶 步行模式'); } lastSpace = n; }
});
addEventListener('keyup', (e) => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; firing = false; });
addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = gunCam.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); gunCam.updateProjectionMatrix();
});

// ───────────────────────── 每帧：模拟 + 渲染 ─────────────────────────
const pickBuf = new Float32Array(4), pickPBO = gl.createBuffer(); let pickSync = null;
gl.bindBuffer(gl.PIXEL_PACK_BUFFER, pickPBO); gl.bufferData(gl.PIXEL_PACK_BUFFER, 16, gl.STREAM_READ); gl.bindBuffer(gl.PIXEL_PACK_BUFFER, null);
function passGrid() {
  gridMatP.uniforms.tPos.value = W.rt[W.cur].textures[0];
  renderer.setRenderTarget(W.gridRT); renderer.render(W.gridScene, fsCam);
}
function passSim(dt) {
  const a = W.rt[W.cur], u = simMat.uniforms;
  u.tPos.value = a.textures[0]; u.tVel.value = a.textures[1]; u.tRot.value = a.textures[2];
  u.uDt.value = dt; u.uFrame.value = frameNo++; u.uRebuildT.value = rebuildT; u.uNF.value = nf;
  runPass(simMat, W.rt[1 - W.cur]); W.cur = 1 - W.cur;
}
function passShadow() {
  shadowMat.uniforms.tPos.value = W.rt[W.cur].textures[0];
  renderer.setRenderTarget(W.shadowRT); renderer.render(W.shadowScene, fsCam);
}
const shadowDue = () => shadowsOn && (W.N < 1.5e6 || (frameNo & 1));   // 百万级以上隔帧更新阴影贴图
function applyPick() { aim.set(pickBuf[0], pickBuf[1], pickBuf[2]); aimKind = pickBuf[3]; }
// 准星拾取：1×1 渲染 → PBO 异步回读（不阻塞管线；回读期间 PBO 不保持绑定）
function passPick() {
  if (pickSync) {
    const s = gl.clientWaitSync(pickSync, 0, 0);
    if (s === gl.TIMEOUT_EXPIRED) return;
    if (s !== gl.WAIT_FAILED) {
      gl.bindBuffer(gl.PIXEL_PACK_BUFFER, pickPBO); gl.getBufferSubData(gl.PIXEL_PACK_BUFFER, 0, pickBuf); gl.bindBuffer(gl.PIXEL_PACK_BUFFER, null);
      applyPick();
    }
    gl.deleteSync(pickSync); pickSync = null;
  }
  pickMat.uniforms.uRo.value.copy(camera.position); pickMat.uniforms.uRd.value.copy(aimDir);
  runPass(pickMat, pickRT);
  gl.bindBuffer(gl.PIXEL_PACK_BUFFER, pickPBO); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.FLOAT, 0); gl.bindBuffer(gl.PIXEL_PACK_BUFFER, null);
  pickSync = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0); gl.flush();
}
function renderScene() {
  const cur = W.rt[W.cur];
  boxMat.uniforms.tPos.value = cur.textures[0]; boxMat.uniforms.tRot.value = cur.textures[2];
  ground.material.uniforms.uShOn.value = shadowsOn ? 1 : 0;
  sky.position.copy(camera.position);
  renderer.setRenderTarget(null); renderer.render(scene, camera);
  if (hudOn && active) { renderer.autoClear = false; renderer.clearDepth(); renderer.render(gunScene, gunCam); renderer.autoClear = true; }
}
function tick(rdt) {
  updatePlayer(rdt);
  updateTools(rdt);
  updateFx(rdt * timeScale);
  buildFields();
  passGrid();
  passSim(clamp(rdt, 1 / 240, 1 / 60) * timeScale);
  if (shadowDue()) passShadow();
  passPick();
  renderScene();
}

function setTier(i, seed = (Math.random() * 1e9) | 0) {
  if (TIERS[i].G * TX > MAX_TEX) { toast('显卡最大纹理尺寸不够'); return false; }
  if (W) disposeWorld(W);
  shots.length = 0; meteors.length = 0; later.length = 0;
  for (const h of holes) scene.remove(h.mesh); holes.length = 0;
  for (const t of twisters) scene.remove(t.mesh); twisters.length = 0;
  for (const s of SCORCH) s.set(0, 0, 0, 0);
  rebuildT = -1; tierIdx = i;
  W = createWorld(i, seed);
  const gu = ground.material.uniforms;
  gu.tSh.value = W.shadowRT.texture; gu.uShHalf.value = W.shHalf; gu.uFogNear.value = boxMat.uniforms.uFogNear.value; gu.uFogFar.value = boxMat.uniforms.uFogFar.value;
  document.querySelectorAll('#tiers button').forEach((b, j) => b.classList.toggle('on', j === i));
  return true;
}

// ───────────────────────── 跑分 ─────────────────────────
const px1 = new Uint8Array(4);
const sync = () => { renderer.setRenderTarget(null); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px1); };
const mc = new MessageChannel(); let mcRes = null; mc.port1.onmessage = () => { const r = mcRes; mcRes = null; if (r) r(); };
const yieldNow = () => new Promise((r) => { mcRes = r; mc.port2.postMessage(0); });
const bench = { on: false, results: [] };
function benchStep() { buildFields(); passGrid(); passSim(1 / 60); if (shadowDue()) passShadow(); updateFx(1 / 60); renderScene(); sync(); }
// 开局快速试跑 26 万档，按每帧耗时挑一个留足余量的默认档位（最高自动到 105 万，更高的自己点）
function calibrate() {
  setTier(2);
  for (let i = 0; i < 6; i++) benchStep();
  const t0 = performance.now(); for (let i = 0; i < 12; i++) benchStep();
  const ms = (performance.now() - t0) / 12; let pick = 0;
  for (let i = 0; i <= 4; i++) if (ms * TIERS[i].S ** 2 / 262144 <= 5 && TIERS[i].G * TX <= MAX_TEX) pick = i;
  if (pick !== 2) setTier(pick);
  return ms;
}
async function benchRun(n, measure) {
  let sum = 0, worst = 0;
  for (let i = 0; i < n; i++) {
    const t0 = performance.now(); benchStep(); const d = performance.now() - t0; sum += d; worst = Math.max(worst, d);
    if ((i & 3) === 3) await yieldNow();
    if (lost) break;
  }
  return measure ? { ms: sum / n, worst } : null;
}
function benchCam() { const G = W.G; camera.position.set(0, G * 0.32, G * 0.62); camera.lookAt(0, 8, 0); camera.updateMatrixWorld(); camera.getWorldDirection(aimDir); }
async function runBenchmark(maxTier = TIERS.length - 1, stopMs = 150) {
  if (bench.on) return;
  bench.on = true; bench.results = []; const prevTier = tierIdx, out = $('benchOut');
  const saveActive = active; active = false;
  for (let i = 0; i <= maxTier && !lost; i++) {
    if (TIERS[i].G * TX > MAX_TEX) break;
    out.innerHTML = renderBench() + `<div class="lab">正在测试 ${fmtCN(TIERS[i].S ** 2)} 个 Box…</div>`;
    await yieldNow();
    const t0 = performance.now();
    setTier(i, 1234567); benchCam(); benchStep();
    const initMs = performance.now() - t0;
    await benchRun(20, false);
    const idle = await benchRun(40, true);
    // 全城轰炸：让绝大部分 Box 同时处于活跃状态
    const G = W.G, step = Math.max(64, G / 16);
    for (let x = -G / 2 + step / 2; x < G / 2; x += step) for (let z = -G / 2 + step / 2; z < G / 2; z += step) explode(new V3(x, 4, z), step * 0.88, 60, 1.2, true);
    while (shots.length && !lost) { benchStep(); await yieldNow(); }
    await benchRun(12, false);
    let chaos = await benchRun(8, true), rubble = null;
    if (chaos.ms <= stopMs) {      // 太慢的档位就不再等它落地了
      chaos = await benchRun(40, true);
      await benchRun(150, false);
      rubble = (await benchRun(30, true)).ms;
    }
    bench.results.push({ boxes: W.N, idle: idle.ms, chaos: chaos.ms, chaosWorst: chaos.worst, rubble, initMs, px: `${canvas.width}×${canvas.height}` });
    out.innerHTML = renderBench();
    if (chaos.ms > stopMs) break;
  }
  bench.on = false; active = saveActive;
  if (!lost) {
    const ok = bench.results.filter((r) => r.chaos <= 16.7), best = ok.length ? ok[ok.length - 1] : bench.results[0];
    const bi = TIERS.findIndex((t) => t.S ** 2 === best.boxes);
    setTier(bi >= 0 ? bi : prevTier);
    out.innerHTML = renderBench() + `<div class="lab">已切换到能稳 60 FPS 的最高档：${fmtCN(best.boxes)} · 画布 ${canvas.width}×${canvas.height}</div>`;
  }
  return bench.results;
}
function renderBench() {
  if (!bench.results.length) return '';
  const cell = (ms) => ms == null ? '<td>—</td>' : `<td class="${ms <= 16.7 ? 'g' : ms <= 33.4 ? 'y' : 'r'}">${ms.toFixed(1)} ms · ${Math.round(1000 / ms)} FPS</td>`;
  return `<table><tr><th>Box 数量</th><th>静止城市</th><th>全城爆炸中</th><th>满地废墟</th></tr>` +
    bench.results.map((r) => `<tr><td>${r.boxes.toLocaleString()}</td>${cell(r.idle)}${cell(r.chaos)}${cell(r.rubble)}</tr>`).join('') + `</table>`;
}
// 分阶段耗时（调试用）
function profile(n = 30) {
  const acc = { grid: 0, sim: 0, shadow: 0, render: 0 }, T = (k, fn) => { const t0 = performance.now(); fn(); sync(); acc[k] += performance.now() - t0; };
  sync();
  for (let i = 0; i < n; i++) { buildFields(); T('grid', passGrid); T('sim', () => passSim(1 / 60)); T('shadow', passShadow); T('render', renderScene); }
  for (const k in acc) acc[k] = +(acc[k] / n).toFixed(2);
  return acc;
}

// 状态普查（调试用，会整张回读，别每帧调）
function census() {
  const S = W.S, buf = new Float32Array(S * S * 4), c = [0, 0, 0, 0, 0, 0]; let maxY = 0, sumY = 0;
  renderer.readRenderTargetPixels(W.rt[W.cur], 0, 0, S, S, buf);
  for (let i = 0; i < S * S; i++) { const st = Math.floor(buf[i * 4 + 3]); c[st]++; if (st === 1) { sumY += buf[i * 4 + 1]; maxY = Math.max(maxY, buf[i * 4 + 1]); } }
  return { lattice: c[0], awake: c[1], rubble: c[2], eaten: c[3], returning: c[4], unused: c[5], awakeMeanY: c[1] ? +(sumY / c[1]).toFixed(1) : 0, awakeMaxY: +maxY.toFixed(1) };
}

// ───────────────────────── HUD / 菜单 ─────────────────────────
$('tools').innerHTML = TOOLS.map((t, i) => `<div class="tool card"><span class="k">${i + 1}</span><span class="ic">${t.icon}</span>${t.name}</div>`).join('');
$('tiers').innerHTML = TIERS.map((t, i) => `<button data-i="${i}" ${t.G * TX > MAX_TEX ? 'disabled' : ''}>${fmtCN(t.S * t.S)}</button>`).join('');
$('tiers').addEventListener('click', (e) => { const i = e.target.dataset.i; if (i !== undefined && !bench.on) setTier(+i); });
$('play').addEventListener('click', () => { if (!bench.on) enter(); });
$('bench').addEventListener('click', () => { sfx.init(); runBenchmark(); });
$('gpu').textContent = `${GPU} · 最大纹理 ${MAX_TEX}`;

let last = performance.now(), fpsT = 0, fpsN = 0, fps = 0, cpuMs = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (bench.on || lost) { last = now; return; }
  const rdt = Math.min((now - last) / 1000, 0.1); last = now;
  const t0 = performance.now();
  tick(rdt);
  cpuMs += (performance.now() - t0 - cpuMs) * 0.1;
  fpsT += rdt; fpsN++;
  if (fpsT >= 0.4) {
    fps = fpsN / fpsT; fpsT = 0; fpsN = 0;
    $('stats').innerHTML = `<b>${Math.round(fps)}</b> FPS <span class="dim">CPU ${cpuMs.toFixed(1)} ms</span><br>📦 ${W.N.toLocaleString()} 个 Box<br><span class="dim">${P.fly ? '飞行' : '步行'}${timeScale < 1 ? ' · 慢动作' : ''} · ${canvas.width}×${canvas.height}</span>`;
  }
}

calibrate();
selectTool(0);
P.yaw = 0;
window.SIM = {
  THREE, renderer, gl, camera, scene, bolts, P, TIERS, bench, get W() { return W; }, get fps() { return fps; }, get lost() { return lost; },
  setTier, fire: (t, x, y, z) => fire(t, new V3(x, y, z)), explode: (x, y, z, R = 10, S = 40) => explode(new V3(x, y, z), R, S),
  rebuild: startRebuild, runBenchmark, profile, census, benchCam, tick, setActive,
  set shadows(v) { shadowsOn = v; }, get shadows() { return shadowsOn; },
  get aim() { return { x: aim.x, y: aim.y, z: aim.z, kind: aimKind }; },
};
requestAnimationFrame(frame);
</script>
</body>
</html>
